[package]
name = "agentic-cli-status"
version = "0.1.0"
edition = "2021"
description = "Headless rate-limit poller for the agentic coding CLI status bar"
license = "MIT"
publish = false

[[bin]]
name = "agentic-cli-status"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "1"
ureq = "2"

[dev-dependencies]
regex = "1"
tempfile = "3"

[[bin]]
name = "harbor-taskbar"
path = "src/harbor_main.rs"
